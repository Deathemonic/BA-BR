name: Build and Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        type: string
      prerelease:
        type: boolean
        default: false

jobs:
  build:
    name: Build for ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    strategy:
      matrix:
        config:
          - { name: linux-x86_64, os: ubuntu-latest, rid: linux-x64 }
          - { name: linux-aarch64, os: ubuntu-24.04-arm, rid: linux-arm64 }
          - { name: windows-x86_64, os: windows-latest, rid: win-x64 }
          - { name: windows-aarch64, os: windows-11-vs2026-arm, rid: win-arm64 }
          - { name: macos-x86_64, os: macos-26-intel, rid: osx-x64 }
          - { name: macos-aarch64, os: macos-latest, rid: osx-arm64 }

    env:
      ASSET_PREFIX: babr

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ matrix.config.rid }}-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-${{ matrix.config.rid }}-

      - name: Download FMOD libraries
        shell: bash
        run: |
          curl -L -o fmod.zip "${{ secrets.FMOD }}"
          unzip -o fmod.zip -d Source/BABR.FMOD/Native/

      - name: Publish
        run: dotnet publish Source/BABR.CLI/BABR.CLI.csproj -c Release -r ${{ matrix.config.rid }} -o ./publish/${{ matrix.config.rid }}

      - name: Remove dev files
        shell: bash
        run: |
          find ./publish/${{ matrix.config.rid }} -name "*.pdb" -type f -delete
          find ./publish/${{ matrix.config.rid }} -name "*.dbg" -type f -delete
          find ./publish/${{ matrix.config.rid }} -name "*.dsym" -type d -exec rm -rf {} +

      - name: Zip build output
        uses: vimtor/action-zip@v1.3
        with:
          files: publish/${{ matrix.config.rid }}
          dest: ${{ env.ASSET_PREFIX }}-${{ matrix.config.name }}.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_PREFIX }}-${{ matrix.config.name }}
          path: ${{ env.ASSET_PREFIX }}-${{ matrix.config.name }}.zip

  deploy:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.tag != ''

    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        if: inputs.tag != ''
        uses: actions/checkout@v4

      - name: Create tag
        if: inputs.tag != ''
        run: |
          git tag ${{ inputs.tag }}
          git push origin ${{ inputs.tag }}

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: artifacts/*.zip
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}